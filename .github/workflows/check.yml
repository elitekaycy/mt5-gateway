name: check

# Fast feedback on every PR and on pushes to the dev integration branch:
# run the unit tests. The app's MetaTrader5 dependency is Windows-only, so the
# suite stubs it (tests/conftest.py) and covers the mt5-free logic.
#
# `test` and `docker-build` are required status checks on dev's branch
# protection, so both jobs must still run (even as a no-op) rather than being
# skipped by the workflow's own `on.paths` — a required check that never runs
# blocks the merge. Instead, the `changes` job decides whether any changed
# file is outside docs/markdown, and `test`/`docker-build` report "skipped"
# (which satisfies a required check) when a PR touches only docs.

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      non_docs: ${{ steps.filter.outputs.non_docs }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            non_docs:
              - '!docs/**'
              - '!mkdocs.yml'
              - '!requirements-docs.txt'
              - '!.github/workflows/docs.yml'
              - '!**/*.md'

  test:
    needs: changes
    if: needs.changes.outputs.non_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app/
      - run: pytest -q --cov
      - name: Check shell scripts
        run: shellcheck scripts/*.sh

  docker-build:
    needs: changes
    if: needs.changes.outputs.non_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate Docker build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: mt5-gateway:test
          # The Wine/Mono/Python/MT5 template layers are ~30+ min of downloads and
          # Wine-side installs; reuse them across runs so a PR build is minutes.
          cache-from: type=gha,scope=mt5-gateway
          cache-to: type=gha,mode=max,scope=mt5-gateway
