name: docker

# Build the gateway image and push it to Docker Hub (elitekaycy/mt5-gateway-api).
# Fires when main advances (via the promote-to-main flow's explicit dispatch —
# GITHUB_TOKEN merges don't trigger push workflows) and on manual dispatch.
#
# One build per release publishes every tag: `latest` (main only), the VERSION
# file value, the `v`-prefixed form, and a `sha-<commit>` tag for precise
# pinning. Tag pushes deliberately do NOT trigger this workflow: a second build
# of the same commit races the first and overwrites the shared tags with a
# different digest.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Free disk space for the Wine image build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: elitekaycy/mt5-gateway-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=v${{ steps.ver.outputs.version }}
            type=sha

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build for security scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse the heavy Wine/template layers from the shared cache, but bust
          # the MT5 layer on every release so the published image bakes the
          # freshest terminal (PR builds keep the default MT5_LAYER_REV).
          cache-from: type=gha,scope=mt5-gateway
          build-args: MT5_LAYER_REV=${{ github.sha }}

      - name: Scan release candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: elitekaycy/mt5-gateway-api:${{ steps.ver.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          scanners: vuln
          timeout: 30m0s
          exit-code: 1

      - name: Push scanned image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=mt5-gateway
          cache-to: type=gha,mode=max,scope=mt5-gateway
          build-args: MT5_LAYER_REV=${{ github.sha }}
