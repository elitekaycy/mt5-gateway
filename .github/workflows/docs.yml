name: docs

# Builds the MkDocs Material site and deploys it to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs + plugins
        run: pip install -r requirements-docs.txt

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Fails the run when the live site is not answering, so a Pages setting that drifts (source branch,
  # custom domain) is noticed on the next deploy instead of by a visitor.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check the live site answers
        run: |
          url=https://mt5.tryqkt.com/
          for _ in $(seq 1 8); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
            [ "$code" = 200 ] && exit 0
            sleep 15
          done
          echo "::error::$url answered ${code:-nothing} after the deploy: check Settings > Pages (source GitHub Actions, custom domain)"
          exit 1
