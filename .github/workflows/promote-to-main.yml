name: promote-to-main

# Manual promotion: dev -> main. A maintainer triggers this from the Actions tab
# (or `gh workflow run promote-to-main.yml`) after inspecting dev. Branch
# protection blocks direct pushes and fast-forwards, and merges made with
# GITHUB_TOKEN do not themselves trigger other workflows — so promotion works
# through a PR: verify dev is green, build a promote branch (dev + a merge of
# main, so the squash-only history still merges cleanly), wait for its checks,
# squash-merge, tag the release, then dispatch the image build on main.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Verify check passed on dev
        run: |
          set -e
          conclusion=$(gh run list --workflow check.yml --branch dev \
            --limit 1 --json conclusion --jq '.[0].conclusion')
          echo "latest check run on dev: '$conclusion'"
          if [ "$conclusion" != "success" ]; then
            echo "::error::dev's latest check run is '$conclusion', not 'success' — refusing to promote"
            exit 1
          fi

      - name: Guard version and tag
        run: |
          set -e
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_ENV"
          git fetch origin main --tags
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists — bump VERSION on dev before promoting"
            exit 1
          fi

      - name: Build promote branch (dev + merge of main)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="promote/$version"
          git checkout -B "$branch" origin/dev
          # main is promotion-only: each of its commits is a squash of code that
          # already landed on dev, so main's content is never newer than dev's.
          # Refuse if anything else ever lands there — a hotfix committed straight
          # to main would be real work, and discarding it silently is not ours to do.
          unexpected=$(git log --format='%h %s' origin/dev..origin/main \
            | grep -v 'chore: promote gateway' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::main carries commits that are not promotions; merge them into dev by hand first:"
            echo "$unexpected"
            exit 1
          fi
          # Record main as a parent while keeping dev's tree. A plain merge conflicts
          # on every file both sides touched, because main's squashes re-record the
          # same changes under different commits (#67) — that is what broke the
          # 0.3.15 promotion. `-s ours` is correct precisely because main adds nothing.
          git merge -s ours origin/main --no-edit
          if ! git diff --quiet origin/dev HEAD; then
            echo "::error::promote branch tree differs from dev after the merge; refusing"
            git diff --stat origin/dev HEAD
            exit 1
          fi
          git push -f origin "$branch"

      - name: Open or reuse promote PR
        id: pr
        run: |
          set -e
          branch="promote/$version"
          url=$(gh pr list --head "$branch" --base main --state open --json url --jq '.[0].url' || true)
          if [ -z "$url" ]; then
            url=$(gh pr create --base main --head "$branch" \
              --title "chore: promote gateway $version" \
              --body "Automated promote dev → main for $version (promote-to-main workflow).")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "promote PR: $url"

      - name: Wait for promote PR checks
        run: |
          set -e
          branch="promote/$version"
          for i in $(seq 1 45); do
            sleep 60
            if out=$(gh pr checks "$branch" 2>&1); then
              echo "checks green"
              exit 0
            fi
            if echo "$out" | grep -qiE '\bfail|error'; then
              echo "::error::promote PR checks failed:"
              echo "$out"
              exit 1
            fi
            echo "checks pending ($i/45)"
          done
          echo "::error::timed out waiting for promote PR checks"
          exit 1

      - name: Merge, tag, release, dispatch image build
        run: |
          set -e
          branch="promote/$version"
          gh pr merge "$branch" --squash --delete-branch
          git fetch origin main
          sha=$(git rev-parse origin/main)
          gh release create "v$version" --generate-notes --title "v$version" --target "$sha"
          # GITHUB_TOKEN merges do not trigger push workflows, so dispatch the
          # image build explicitly.
          gh workflow run docker.yml --ref main
